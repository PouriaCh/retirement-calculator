<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <!-- Coin slot on top -->
  <rect x="13" y="4" width="6" height="2" rx="1" fill="#1F8EF1"/>
  <!-- Piggy bank body -->
  <ellipse cx="15" cy="20" rx="9" ry="8" fill="#1F8EF1"/>
  <!-- Snout -->
  <ellipse cx="24" cy="21" rx="3" ry="2.5" fill="#1F8EF1"/>
  <circle cx="23.2" cy="20.5" r="0.7" fill="#0f172a"/>
  <circle cx="24.8" cy="20.5" r="0.7" fill="#0f172a"/>
  <!-- Eye -->
  <circle cx="19" cy="17" r="1" fill="#0f172a"/>
  <!-- Ear -->
  <ellipse cx="9" cy="15" rx="2.5" ry="2" fill="#1F8EF1"/>
  <ellipse cx="9" cy="15" rx="1.4" ry="1.1" fill="#0ea5e9" opacity="0.5"/>
  <!-- Legs -->
  <rect x="10" y="26.5" width="3" height="3" rx="1.2" fill="#1F8EF1"/>
  <rect x="14.5" y="26.5" width="3" height="3" rx="1.2" fill="#1F8EF1"/>
</svg>
